.db-intro{position:relative;max-width:1100px;margin:0 auto;padding:30px 28px 0;color:#fff}

.db-main,.db-side{display:grid;gap:20px;min-width:0}
.db-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px}

.db-sub{margin:0 0 18px;font-size:14px;color:var(--muted)}
.db-empty{margin:0;padding:18px;border-radius:12px;background:var(--paper);color:var(--muted);font-size:14px;list-style:none}
.db-insight{margin:18px 0 0;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:15px;color:var(--night)}

.db-tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:0 18px 36px -28px rgba(21,27,77,.5)}
.db-tile.accent{background:var(--night);border-color:var(--night);color:#fff}

.db-stack span{display:block;height:100%;min-width:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.db-stack span.mine{outline:3px solid var(--night);outline-offset:-3px}
.db-legend{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 18px}

.db-legend li.mine .db-legend-l{font-weight:600}
.you{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--gold);color:var(--night);white-space:nowrap}
.db-bars{display:grid;gap:10px}

.db-bar.mine .db-bar-track span{background:linear-gradient(90deg,var(--sky),var(--indigo))}
.db-bar.mine .db-bar-l{font-weight:600}
.db-bar-n{text-align:right;font-weight:600;color:var(--night);font-variant-numeric:tabular-nums}

.db-feed{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:2px}

.db-feed-codes{grid-row:1/3;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.db-feed-text{font-size:14px;color:var(--ink)}
.db-feed-t{font-size:12px;color:var(--muted)}
.db-level{height:8px;border-radius:99px;background:var(--paper);overflow:hidden;margin:-8px 0 16px}
.db-level span{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--gold));border-radius:99px}
.db-quests{list-style:none;padding:0;margin:0;display:grid;gap:8px}

.db-q-mark{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px dashed var(--line);color:#fff}

.db-q-l{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.db-quests li.locked .db-q-l{color:var(--muted)}
.db-q-xp{margin-left:auto;font-weight:600;color:#8A5A00;white-space:nowrap}
@media (max-width:900px){
  .db-nav{order:3;width:100%;margin-left:0;overflow-x:auto}
  .db-intro{padding:18px 16px 0}
  .db-headline{font-size:24px}
  .db-sample{margin:-70px 14px 16px}
  .db-grid{grid-template-columns:1fr;padding:0 14px 60px}

.db-row-between{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}

.admin-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.admin-stats div{display:flex;flex-direction:column;padding:12px;border-radius:12px;background:var(--paper)}
.admin-n{font-family:'Unbounded',sans-serif;font-weight:700;font-size:24px;color:var(--indigo)}
.admin-l,.admin-small{font-size:13px;color:var(--muted)}
.admin-small{display:block;margin:0}
.admin-toggle{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);cursor:pointer}
.admin-toggle input{width:20px;height:20px;margin-top:2px;accent-color:var(--indigo)}
.admin-danger{display:grid;gap:4px;padding:12px;border-radius:12px;background:#FFF1F0;border:1px solid #F5C7C2}
.admin-danger .back{justify-self:start;margin:0;color:#B3261E;font-weight:600}
@media (max-width:900px){
  .streak{width:100%}
  .tl{grid-template-columns:1fr;gap:12px}
  .tl::before{left:9px;right:auto;top:10px;bottom:10px;width:3px;height:auto}
  .tl li{flex-direction:row;text-align:left;align-items:center}
  .tl-dot{flex:none}
  .tl-tags{flex-direction:row;min-height:0}
  .tl-count{width:76px;height:76px}
  .tl-count-n{font-size:22px}
  .board{padding:16px}
  .board-row{grid-template-columns:1fr auto;row-gap:2px}
  .board-cols span:nth-child(3){display:none}
  .board-status{grid-column:1/-1;padding-left:50px}
}

/* ---------- Path choice and senior flow ---------- */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.role{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;font:inherit;padding:22px;border-radius:18px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:border-color .15s,transform .1s,box-shadow .15s}
.role:hover{border-color:var(--sky);transform:translateY(-2px);box-shadow:0 18px 30px -24px rgba(21,27,77,.6)}
.role:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.role.senior{background:linear-gradient(160deg,#FFF8E8,#fff)}
.role-ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--soft)}
.role.senior .role-ic{background:#FFEFCB}
.role-t{font-weight:600;font-size:18px;color:var(--night)}
.role-s{font-size:14px;color:var(--muted)}
.role-cta{margin-top:auto;padding-top:8px;font-weight:600;color:var(--indigo)}
.uni-search{width:100%;max-width:520px;margin-bottom:10px}
.uni-list{display:grid;gap:6px;max-height:300px;overflow-y:auto;padding:4px;margin-bottom:14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);max-width:520px}
.uni{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid transparent;background:#fff;color:var(--ink);cursor:pointer}
.uni:hover{border-color:var(--sky)}
.uni.on{border-color:var(--indigo);background:var(--soft)}
.uni-n{font-weight:500}
.uni-c{font-size:13px;color:var(--muted);white-space:nowrap}
.custom-uni{max-width:520px}
.custom-uni input{width:100%}
.years{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;margin:0 0 18px}
.years select{width:100%}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:14px;max-width:540px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--indigo)}
.senior-pass .pass-head.senior{background:linear-gradient(90deg,var(--night),#3A2A00)}
.sp-uni{display:flex;align-items:center;gap:14px;padding:14px 0 16px;margin:10px 0 16px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.sp-code{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:30px;color:#B47A00;letter-spacing:.04em}
.sp-uni-n{font-size:17px;font-weight:600;line-height:1.3}
.sp-helps{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sp-helps span{font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;background:#FFF3D6;border:1px solid #F5D48A;color:#6A4A00}
.sp-status{font-weight:600;font-size:14px;color:#8A5A00}
.sp-status.ok{color:#1F8A4E}
.sp-status.no{color:#B3261E}
.sp-status.draft{color:var(--muted)}
.layout.solo{grid-template-columns:minmax(0,760px);justify-content:center}
.senior-hero{background:linear-gradient(135deg,var(--night) 0%,#2A2A6E 55%,#5B4300 100%)}
.verify-card{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border-radius:18px;background:#FFF6E0;border:1px solid #F5D48A}
.verify-card.no{background:#FFF1F0;border-color:#F5C7C2}
.verify-card.inline{margin:0 0 4px}
.verify-ic{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gold);color:var(--night);font-weight:700;font-size:18px}
.verify-card.no .verify-ic{background:#B3261E;color:#fff}
.rules{margin:4px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--ink)}
.seniors-card{background:linear-gradient(160deg,#FFF8E8,#fff)}
.seniors-n{font-family:'Unbounded',sans-serif;font-weight:700;font-size:30px;color:#B47A00;margin:4px 0 2px}
.admin-tabs{display:flex;gap:6px;padding:4px;border-radius:12px;background:var(--paper)}
.admin-tabs button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:8px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;gap:6px;justify-content:center;align-items:center}
.admin-tabs button.on{background:#fff;color:var(--night);box-shadow:0 2px 6px -3px rgba(0,0,0,.3)}
.admin-badge{font-size:11px;padding:0 7px;border-radius:99px;background:var(--gold);color:var(--night)}
.admin-list{display:grid;gap:8px;max-height:52vh;overflow-y:auto}
.admin-senior{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line)}
.admin-senior-n{font-weight:600;font-size:15px}
.admin-senior-a{display:flex;align-items:center;gap:10px;flex:none}
.admin-senior-a .back{margin:0;padding:0;font-size:14px;font-weight:600}
.admin-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:capitalize}
.admin-pill.pending{background:#FFF3D6;color:#8A5A00}
.admin-pill.approved{background:#EAF8F0;color:#1F8A4E}
.admin-pill.rejected{background:#FFF1F0;color:#B3261E}
.admin{max-height:90vh;overflow-y:auto}
@media (max-width:900px){
  .roles{grid-template-columns:1fr}
  .admin-senior{flex-direction:column;align-items:flex-start}
}

/* ---------- Round tables ---------- */
.db-hero.compact{padding-bottom:0}
.quest-link{font:inherit;background:none;border:0;padding:0;color:var(--indigo);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.tables-wrap{max-width:1100px;margin:0 auto;padding:32px 28px 80px}
.tables-intro{margin-bottom:26px}
.tables-h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:32px;letter-spacing:-.02em;margin:0 0 8px;color:var(--night)}
.tables-section{margin-bottom:30px}
.type-tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:2px 9px;border-radius:99px}
.my-tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.my-table{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;font:inherit;padding:18px;border-radius:18px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:border-color .15s,transform .1s}
.my-table:hover{border-color:var(--sky);transform:translateY(-2px)}
.my-table:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.my-table-t{font-weight:600;font-size:17px;color:var(--night)}
.my-table-s{font-size:13px;color:var(--muted)}
.my-table-cta{font-weight:600;color:var(--indigo);font-size:14px}
.avs{display:flex}
.avs .av{margin-right:-8px;border:2px solid #fff}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--indigo)}
.av.guide{background:var(--gold);color:var(--night)}
.av.senior{background:#DDF5E7;color:#1F8A4E}
.av.empty{background:#fff;border:2px dashed var(--line);color:var(--muted)}
.join-msg{padding:12px 16px;border-radius:12px;background:#FFF6E0;border:1px solid #F5D48A;color:#5A4200;font-size:14px}
.join-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.join-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.join-card.guide{background:linear-gradient(160deg,#FFF8E8,#fff);border-color:#F5D48A}
.join-t{margin:4px 0 0;font-size:18px;font-weight:600;color:var(--night)}
.join-d{margin:0;font-size:14px;color:var(--muted);flex:1}
.join-card .btn{margin-top:8px}
.join-lock{margin:8px 0 0;font-size:13px;color:var(--muted)}
.join-lock.ok{color:#1F8A4E;font-weight:600}
.room-head{margin-bottom:18px}
.room-head .back{margin:0 0 10px;padding:0}
.room-title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.room-title{font-family:'Unbounded',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;margin:8px 0 4px;color:var(--night)}
.leave{color:#B3261E !important;margin:0 !important}
.room-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.room-side{display:grid;gap:16px}
.chat{display:flex;flex-direction:column;padding:0;overflow:hidden}
.chat-list{height:440px;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#FAFBFF,#fff)}
.chat-empty{margin:auto;text-align:center;display:grid;gap:4px;max-width:34ch;color:var(--muted)}
.chat-empty b{color:var(--night);font-size:17px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:80%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg-body{display:grid;gap:4px}
.msg-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.msg.mine .msg-meta{justify-content:flex-end}
.msg-meta b{color:var(--night);font-size:13px}
.msg-text{padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--paper);border:1px solid var(--line);font-size:15px;white-space:pre-wrap;word-break:break-word}
.msg.mine .msg-text{background:var(--indigo);color:#fff;border-color:var(--indigo);border-radius:16px 16px 4px 16px}
.chip-role{font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
.chip-role.guide{background:var(--gold);color:var(--night)}
.chip-role.senior{background:#DDF5E7;color:#1F8A4E}
.starters{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
.starters .chip{font-size:13px;padding:7px 12px}
.composer{display:flex;gap:10px;align-items:flex-end;padding:14px 16px;border-top:1px solid var(--line);background:#fff}
.composer textarea{flex:1;resize:none;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;color:var(--ink)}
.composer textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px var(--soft)}
.chat .err{padding:0 16px 12px}
.people{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}
.people li{display:flex;align-items:center;gap:10px;font-size:15px}
.people-n{font-weight:500}
.people-empty{color:var(--muted);font-size:14px !important}
.sp-helps.looking span{background:var(--soft);border-color:#C4CBF0;color:var(--indigo)}
@media (max-width:900px){
  .tables-wrap{padding:20px 14px 60px}
  .tables-h1{font-size:26px}
  .room-grid{grid-template-columns:1fr}
  .chat-list{height:380px}
  .msg{max-width:92%}
}

/* ---------- Hidden counts, reports, settings ---------- */
.circle-note{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 36px -28px rgba(21,27,77,.5)}
.circle-note > div{flex:1;min-width:220px}
.xp-num.since{font-family:'IBM Plex Sans',sans-serif;font-size:16px}
.msg-report{justify-self:start;font:inherit;font-size:12px;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;opacity:.75}
.msg-report:hover{opacity:1;color:#B3261E;text-decoration:underline}
.msg-report:disabled{cursor:default;color:var(--muted);text-decoration:none}
.toast{margin:0 16px 12px;padding:10px 12px;border-radius:10px;background:#EAF8F0;color:#1F6B40;font-size:14px}
.danger-btn{background:#B3261E;box-shadow:0 4px 0 #7A1A14}
.danger-btn:hover:not(:disabled){background:#C8372D}
.admin{max-width:560px}
.admin-tabs button{font-size:13px;padding:8px 6px}
.admin-report{display:grid;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line)}
.admin-quote{padding:10px 12px;border-radius:10px;background:var(--paper);font-size:14px;word-break:break-word}
.back.danger{color:#B3261E}
.admin-settings{display:grid;gap:10px}
.admin-field{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px;border-radius:12px;border:1px solid var(--line)}
.admin-field > span{display:grid;gap:2px}
.admin-field input{width:110px;font-size:16px;padding:8px 10px}
.admin-small.ok{color:#1F8A4E;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
`;


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
